<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Travel & Tourism</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100">
  <div class="flex items-center justify-center min-h-screen">
    <div class="container p-4 mx-auto">
      <h1 id="main-title" class="text-5xl font-bold text-center text-blue-700 mb-8 drop-shadow-md">
        Travel & Tourism
      </h1>

      <!-- Error Box -->
      <div id="error-box" class="w-full max-w-md p-3 my-4 text-sm text-red-700 bg-red-100 rounded-lg mx-auto hidden">
        <span class="font-medium">Error:</span> <span id="error-message"></span>
      </div>

      <!-- Login Page -->
      <div id="login-page" class="w-full max-w-md p-8 space-y-6 bg-white rounded-lg shadow-md mx-auto">
        <h2 class="text-3xl font-bold text-center text-gray-900">Sign In</h2>
        <form id="login-form" class="space-y-6">
          <div>
            <label for="login-usernameOrEmail" class="block text-sm font-medium text-gray-700">
              Username or Email
            </label>
            <input id="login-usernameOrEmail" name="usernameOrEmail" type="text" required
              class="w-full px-3 py-2 mt-1 border border-gray-300 rounded-md focus:ring-blue-500"
              placeholder="johndoe123 or you@example.com" />
          </div>
          <div>
            <label for="login-password" class="block text-sm font-medium text-gray-700">Password</label>
            <input id="login-password" name="password" type="password" required
              class="w-full px-3 py-2 mt-1 border border-gray-300 rounded-md focus:ring-blue-500"
              placeholder="••••••••" />
          </div>
          <button id="login-button" type="submit"
            class="w-full flex justify-center py-2 px-4 rounded-md text-sm font-medium text-white bg-blue-600 hover:bg-blue-700">
            <span class="btn-text">Sign In</span>
            <div class="spinner w-5 h-5 border-t-2 border-white rounded-full hidden"></div>
          </button>
        </form>
        <p class="text-sm text-center text-gray-600">
          Don't have an account?
          <button id="show-register" class="font-medium text-blue-600 hover:text-blue-500">Sign Up</button>
        </p>
      </div>

      <!-- Register Page -->
      <div id="register-page" class="w-full max-w-md p-8 space-y-6 bg-white rounded-lg shadow-md mx-auto hidden">
        <h2 class="text-3xl font-bold text-center text-gray-900">Create Account</h2>
        <form id="register-form" class="space-y-6">
          <div>
            <label for="register-full_name" class="block text-sm font-medium text-gray-700">Full Name</label>
            <input id="register-full_name" name="full_name" type="text" required
              class="w-full px-3 py-2 mt-1 border border-gray-300 rounded-md focus:ring-blue-500"
              placeholder="John Doe" />
          </div>
          <div>
            <label for="register-email" class="block text-sm font-medium text-gray-700">Email</label>
            <input id="register-email" name="email" type="email" required
              class="w-full px-3 py-2 mt-1 border border-gray-300 rounded-md focus:ring-blue-500"
              placeholder="you@example.com" />
          </div>
          <div>
            <label for="register-username" class="block text-sm font-medium text-gray-700">Username</label>
            <input id="register-username" name="username" type="text" required
              class="w-full px-3 py-2 mt-1 border border-gray-300 rounded-md focus:ring-blue-500"
              placeholder="johndoe123" />
          </div>
          <div>
            <label for="register-password" class="block text-sm font-medium text-gray-700">Password</label>
            <input id="register-password" name="password" type="password" required
              class="w-full px-3 py-2 mt-1 border border-gray-300 rounded-md focus:ring-blue-500"
              placeholder="••••••••" />
          </div>
          <div>
            <label for="register-confirmPassword" class="block text-sm font-medium text-gray-700">Confirm Password</label>
            <input id="register-confirmPassword" name="confirmPassword" type="password" required
              class="w-full px-3 py-2 mt-1 border border-gray-300 rounded-md focus:ring-blue-500"
              placeholder="••••••••" />
          </div>
          <button id="register-button" type="submit"
            class="w-full flex justify-center py-2 px-4 rounded-md text-sm font-medium text-white bg-blue-600 hover:bg-blue-700">
            <span class="btn-text">Sign Up</span>
            <div class="spinner w-5 h-5 border-t-2 border-white rounded-full hidden"></div>
          </button>
        </form>
        <p class="text-sm text-center text-gray-600">
          Already have an account?
          <button id="show-login" class="font-medium text-blue-600 hover:text-blue-500">Sign In</button>
        </p>
      </div>

      <!-- Dashboard Page -->
      <div id="dashboard-page" class="hidden">
        <header class="flex justify-between items-center mb-4 bg-white p-4 rounded shadow">
          <h1 id="welcome-title" class="text-2xl font-bold">Welcome!</h1>
          <button id="logout-button"
            class="px-4 py-2 bg-red-600 text-white rounded hover:bg-red-700">Logout</button>
        </header>

        <section>
          <h2 class="text-xl font-semibold mb-2">Featured Destinations</h2>
          <div id="destination-cards-container" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
            <div class="destination-card bg-white rounded shadow overflow-hidden hover:scale-105 duration-300">
              <img src="https://placehold.co/600x400/3498db/fff?text=Paris" />
              <div class="p-4">
                <h3 class="destination-name font-bold">Paris, France</h3>
                <p>$1,200</p>
                <button class="book-now-btn w-full mt-2 bg-blue-600 text-white rounded p-2"
                  data-name="Paris, France" data-price="$1,200">Book Now</button>
              </div>
            </div>

            <div class="destination-card bg-white rounded shadow overflow-hidden hover:scale-105 duration-300">
              <img src="https://placehold.co/600x400/e74c3c/fff?text=Kyoto" />
              <div class="p-4">
                <h3 class="destination-name font-bold">Kyoto, Japan</h3>
                <p>$1,800</p>
                <button class="book-now-btn w-full mt-2 bg-blue-600 text-white rounded p-2"
                  data-name="Kyoto, Japan" data-price="$1,800">Book Now</button>
              </div>
            </div>

            <div class="destination-card bg-white rounded shadow overflow-hidden hover:scale-105 duration-300">
              <img src="https://placehold.co/600x400/f1c40f/fff?text=Cairo" />
              <div class="p-4">
                <h3 class="destination-name font-bold">Cairo, Egypt</h3>
                <p>$950</p>
                <button class="book-now-btn w-full mt-2 bg-blue-600 text-white rounded p-2"
                  data-name="Cairo, Egypt" data-price="$950">Book Now</button>
              </div>
            </div>

            <div class="destination-card bg-white rounded shadow overflow-hidden hover:scale-105 duration-300">
              <img src="https://placehold.co/600x400/2ecc71/fff?text=Rio" />
              <div class="p-4">
                <h3 class="destination-name font-bold">Rio, Brazil</h3>
                <p>$1,100</p>
                <button class="book-now-btn w-full mt-2 bg-blue-600 text-white rounded p-2"
                  data-name="Rio, Brazil" data-price="$1,100">Book Now</button>
              </div>
            </div>
          </div>
        </section>

        <section class="mt-6">
          <h2 class="text-xl font-semibold mb-2">Your Bookings</h2>
          <div class="bg-white p-4 rounded shadow">
            <p id="no-bookings-msg" class="text-gray-500">You have no active bookings.</p>
            <div id="bookings-list" class="space-y-2"></div>
          </div>
        </section>
      </div>
    </div>
  </div>

  <script src="javascript.js"></script>
</body>
</html>
